<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificando... AbrigApp</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/remixicon@3.5.0/fonts/remixicon.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="text-center p-5 bg-white rounded-4 shadow-sm" style="max-width: 500px; width: 100%;">
        <div id="loadingState">
            <div class="spinner-border text-primary" role="status" style="width: 3rem; height: 3rem;"></div>
            <h3 class="mt-4 fw-bold">Verificando tu solicitud...</h3>
            <p class="text-muted">Por favor espera un momento.</p>
        </div>
        
        <div id="successState" style="display: none;">
            <i class="ri-checkbox-circle-fill text-success" style="font-size: 5rem;"></i>
            <h3 class="mt-3 fw-bold text-dark">¡Solicitud en revisión!</h3>
            <p class="text-muted mt-3 fs-5">Tu correo ha sido verificado correctamente. Nuestro equipo de voluntarios revisará tu caso en breve.</p>
            <a href="/apoyo.html" class="btn btn-primary-custom rounded-pill px-5 mt-4 fw-bold">Ir a la sección de apoyo</a>
        </div>
        
        <div id="errorState" style="display: none;">
            <i class="ri-close-circle-fill text-danger" style="font-size: 5rem;"></i>
            <h3 class="mt-3 fw-bold text-dark">Error de verificación</h3>
            <p class="text-muted mt-3" id="errorMsg">El enlace es inválido o ha expirado.</p>
            <a href="/apoyo.html" class="btn btn-outline-secondary rounded-pill px-5 mt-4">Volver</a>
        </div>
    </div>

    <script type="module">
        import '/src/index.css';
    </script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            
            if(!token) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                return;
            }
            
            try {
                const response = await fetch('/api/support/verify/' + token);
                const data = await response.json();
                
                document.getElementById('loadingState').style.display = 'none';
                
                if (response.ok) {
                    document.getElementById('successState').style.display = 'block';
                } else {
                    document.getElementById('errorState').style.display = 'block';
                    document.getElementById('errorMsg').textContent = data.error || 'El enlace es inválido o expiró.';
                }
            } catch (error) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
            }
        });
    </script>
</body>
</html>
